<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feego</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feego">
<meta name="theme-color" content="#FF624C">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Nunito",sans-serif;background:#FFF3DC;color:#62344A;padding:2rem 1rem;}
.dash{max-width:780px;margin:0 auto;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px;}
.logo-img{height:64px;width:auto;mix-blend-mode:multiply;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.add-btn{background:#FF624C;color:white;border:none;border-radius:20px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:"Nunito",sans-serif;font-weight:700;}
.add-btn:hover{background:#e5543f;}
.sync-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.sync-ok{background:#B5DFD9;color:#085041;}
.sync-busy{background:#FFE5B9;color:#854F0B;}
.sync-err{background:#FEC5B9;color:#993C1D;}
.agenda{background:white;border:1px solid #FFD38A;border-radius:16px;margin-bottom:1.5rem;overflow:hidden;}
.agenda-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:#FFF3DC;border-bottom:1px solid #FFD38A;}
.agenda-hdr-title{font-size:14px;font-weight:800;color:#62344A;}
.abadge{font-size:11px;background:#FF624C;color:white;border-radius:20px;padding:2px 9px;font-weight:800;margin-left:8px;}
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;background:#FFF8EE;border-bottom:1px solid #FFE5B9;}
.fchip{font-size:12px;font-weight:700;border-radius:20px;padding:4px 12px;cursor:pointer;border:1.5px solid #FFD38A;background:white;color:#825069;font-family:"Nunito",sans-serif;}
.fchip:hover{background:#FFF3DC;}
.fchip.active{background:#FFAF4B;color:white;border-color:#FFAF4B;}
.fdate-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.fdate-label{font-size:12px;font-weight:700;color:#A07089;}
.fdate{font-size:12px;border:1.5px solid #FFD38A;border-radius:10px;padding:4px 8px;background:white;color:#62344A;font-family:"Nunito",sans-serif;font-weight:600;outline:none;}
.fdate:focus{border-color:#FFAF4B;}
.agenda-body{padding:12px 18px;}
.aday{margin-bottom:14px;}
.aday:last-child{margin-bottom:0;}
.aday-label{font-size:11px;font-weight:800;color:#FFAF4B;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.aday-label.hot{color:#FF624C;}
.aitem{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;padding:8px 10px;background:#FFF3DC;border-radius:10px;}
.acheck{width:16px;height:16px;border-radius:4px;border:1.5px solid #FFAF4B;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:white;}
.acheck.done{background:#44998A;border-color:#44998A;}
.acheck.done::after{content:"";display:block;width:4px;height:7px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);}
.aitem-text{font-size:14px;color:#62344A;line-height:1.4;font-weight:700;}
.aitem-text.done{color:#BA90A6;text-decoration:line-through;}
.aitem-meta{display:flex;align-items:center;gap:8px;margin-top:3px;}
.aitem-stream{font-size:11px;color:#A07089;font-weight:600;}
.aempty{font-size:13px;color:#BA90A6;padding:4px 0;font-weight:600;}
.summary-bar{display:flex;gap:14px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;padding:12px 18px;background:white;border-radius:16px;border:1px solid #FFD38A;}
.si{display:flex;align-items:center;gap:6px;font-size:13px;color:#825069;font-weight:600;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.scard{background:white;border:1px solid #FFD38A;border-radius:16px;margin-bottom:10px;overflow:hidden;}
.shdr{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;border-left:4px solid transparent;}
.shdr.green{border-left-color:#44998A;}
.shdr.yellow{border-left-color:#FFAF4B;}
.shdr.red{border-left-color:#FF624C;}
.shdr:hover{background:#FFF3DC;}
.sname-lbl{font-size:15px;font-weight:800;color:#62344A;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sname-inp{font-size:15px;font-weight:800;color:#62344A;border:1px solid #FFAF4B;border-radius:8px;background:#FFF3DC;outline:none;width:100%;font-family:"Nunito",sans-serif;padding:2px 6px;display:none;}
.sbadge{font-size:11px;border-radius:20px;padding:3px 10px;font-weight:800;white-space:nowrap;cursor:pointer;border:none;font-family:"Nunito",sans-serif;}
.bg{background:#B5DFD9;color:#085041;}
.by{background:#FFE5B9;color:#854F0B;}
.br{background:#FEC5B9;color:#993C1D;}
.sedit{font-size:13px;color:#FFAF4B;cursor:pointer;padding:2px 4px;flex-shrink:0;}
.sedit:hover{color:#62344A;}
.sdel{font-size:13px;color:#D5B288;cursor:pointer;padding:2px 4px;flex-shrink:0;}
.sdel:hover{color:#FF624C;}
.schev{font-size:11px;color:#D5B288;transition:transform 0.2s;flex-shrink:0;}
.schev.open{transform:rotate(180deg);}
.sbody{border-top:1px solid #FFE5B9;padding:14px 18px;display:none;}
.sbody.open{display:block;}
.slbl{font-size:11px;color:#A07089;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em;font-weight:800;}
.step-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;}
.stchk{width:17px;height:17px;border-radius:4px;border:1.5px solid #FFAF4B;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:white;}
.stchk.done{background:#44998A;border-color:#44998A;}
.stchk.done::after{content:"";display:block;width:5px;height:8px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);}
.stmain{flex:1;min-width:0;}
.stxt{font-size:15px;color:#62344A;line-height:1.45;font-weight:700;}
.stxt.done{color:#BA90A6;text-decoration:line-through;}
.smeta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;}
.dlinp{font-size:12px;border:1px solid #FFD38A;border-radius:6px;padding:3px 7px;background:#FFF3DC;color:#825069;font-family:"Nunito",sans-serif;outline:none;cursor:pointer;font-weight:600;}
.dlinp:focus{border-color:#FFAF4B;}
.dltag{font-size:11px;border-radius:6px;padding:2px 7px;font-weight:800;white-space:nowrap;}
.dlok{background:#B5DFD9;color:#085041;}
.dlwarn{background:#FFE5B9;color:#854F0B;}
.dlbad{background:#FEC5B9;color:#993C1D;}
.stdel{font-size:13px;color:#D5B288;cursor:pointer;line-height:1.6;flex-shrink:0;margin-top:2px;}
.stdel:hover{color:#FF624C;}
.addrow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
.addrow input[type=text]{font-size:14px;color:#62344A;border:1px solid #FFD38A;border-radius:10px;padding:6px 10px;background:#FFF3DC;outline:none;flex:1;min-width:160px;font-family:"Nunito",sans-serif;font-weight:600;}
.addrow input[type=text]:focus{border-color:#FFAF4B;}
.addrow input[type=date]{font-size:13px;border:1px solid #FFD38A;border-radius:10px;padding:5px 8px;background:#FFF3DC;color:#825069;font-family:"Nunito",sans-serif;outline:none;font-weight:600;}
.addrow input[type=date]:focus{border-color:#FFAF4B;}
.addrow button{font-size:13px;background:#FFAF4B;color:white;border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:"Nunito",sans-serif;font-weight:700;}
.addrow button:hover{background:#e89d3a;}
.notesarea{margin-top:14px;}
.notesarea textarea{width:100%;font-size:13px;color:#825069;border:1px solid #FFD38A;border-radius:10px;padding:8px 10px;background:#FFF3DC;resize:vertical;min-height:48px;font-family:"Nunito",sans-serif;outline:none;line-height:1.5;font-weight:600;}
.footer{margin-top:1.5rem;text-align:right;font-size:12px;color:#BA90A6;}
.rbtn{font-size:12px;color:#BA90A6;background:none;border:none;cursor:pointer;font-family:"Nunito",sans-serif;text-decoration:underline;font-weight:600;}
.loading{text-align:center;padding:3rem;font-size:14px;color:#A07089;font-weight:700;}

</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//Z" alt="Feego"/>

      <span class="sync-pill sync-busy" id="sync-pill">...</span>
      <button class="add-btn" onclick="addStream()">+ Workstream</button>
    </div>
  </div>
  <div class="agenda">
    <div class="agenda-hdr">
      <div style="display:flex;align-items:center;">
        <span class="agenda-hdr-title">To-dos im Zeitraum</span>
        <span class="abadge" id="abadge">0</span>
      </div>
    </div>
    <div class="filter-bar">
      <button class="fchip active" id="chip-today" onclick="setChip(0)">Heute</button>
      <button class="fchip" id="chip-week" onclick="setChip(1)">Diese Woche</button>
      <button class="fchip" id="chip-2w" onclick="setChip(2)">Nächste 2 Wochen</button>
      <button class="fchip" id="chip-custom" onclick="setChip(3)">Eigener Zeitraum</button>
      <div class="fdate-wrap" id="custom-range" style="display:none;">
        <span class="fdate-label">Von</span>
        <input type="date" class="fdate" id="fdate-from" onchange="renderAgenda()"/>
        <span class="fdate-label">Bis</span>
        <input type="date" class="fdate" id="fdate-to" onchange="renderAgenda()"/>
      </div>
    </div>
    <div class="agenda-body" id="agbody"><p class="aempty">Keine Aufgaben im gewählten Zeitraum.</p></div>
  </div>
  <div class="summary-bar" id="sumbar"></div>
  <div id="streams"></div>
  <div class="footer" id="footer"><button class="rbtn" onclick="resetData()">Auf Standard zurücksetzen</button></div>
</div>

<script>
// ---- CONFIG ----
var SB_URL="https://oikwayrxzlxotewabydc.supabase.co";
var SB_KEY="sb_publishable_WZcOPyrbX5NvQbxyoBoK0A_TibkOpLO";

// ---- STATE ----
var data=[],nextId=50,nextStepId=500,activeChip=0,saveTimer=null;
var BADGE={green:["bg","Läuft"],yellow:["by","In Arbeit"],red:["br","Blockiert"]};
var SESSION_ID=Math.random().toString(36).slice(2);
var lastSaveTime=0;

// ---- SYNC STATUS ----
function pill(state,msg){
  var el=document.getElementById("sync-pill");if(!el)return;
  el.textContent=msg;
  el.className="sync-pill "+(state==="ok"?"sync-ok":state==="busy"?"sync-busy":"sync-err");
}

// ---- SUPABASE REST (no library needed) ----
async function sbGet(){
  try{
    var r=await fetch(SB_URL+"/rest/v1/feego_data?key=eq.dashboard&select=value",{
      headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"}
    });
    if(!r.ok)return null;
    var j=await r.json();
    return(j&&j.length>0)?j[0].value:null;
  }catch(e){return null;}
}

async function sbUpsert(payload){
  // Embed session_id inside value (not as separate DB column)
  var enriched=Object.assign({},payload,{_sid:SESSION_ID});
  try{
    var r=await fetch(SB_URL+"/rest/v1/feego_data",{
      method:"POST",
      headers:{
        "apikey":SB_KEY,
        "Authorization":"Bearer "+SB_KEY,
        "Content-Type":"application/json",
        "Prefer":"resolution=merge-duplicates"
      },
      body:JSON.stringify({key:"dashboard",value:enriched,updated_at:new Date().toISOString()})
    });
    return r.ok;
  }catch(e){return false;}
}

// ---- LOCAL STORAGE ----
function lsGet(){
  var keys=["fgv7","fgv6","fgv5","fgv4","feego_proj_v3","feego_proj_v2"];
  for(var i=0;i<keys.length;i++){
    try{var s=localStorage.getItem(keys[i]);if(s){var p=JSON.parse(s);if(p.d||p.streams)return p;}}catch(e){}
  }
  return null;
}

function lsSet(){
  try{localStorage.setItem("fgv7",JSON.stringify({d:data,ni:nextId,si:nextStepId}));}catch(e){}
}

function normalise(p){
  if(!p)return null;
  if(p.streams)return p;
  if(p.d)return{streams:p.d,nextId:p.ni||50,nextStepId:p.si||500};
  return null;
}

// ---- LOAD ----
async function load(){
  pill("busy","Laden...");

  // 1. Try Supabase first
  var remote=await sbGet();
  if(remote&&remote.streams){
    data=remote.streams;nextId=remote.nextId||50;nextStepId=remote.nextStepId||500;
    lsSet();
    pill("ok","✓ Sync");
    render();
    return;
  }

  // 2. Fall back to localStorage
  var local=normalise(lsGet());
  if(local&&local.streams){
    data=local.streams;nextId=local.nextId||50;nextStepId=local.nextStepId||500;
    pill("busy","Hochladen...");
    render();
    // migrate to supabase in background
    var ok=await sbUpsert({streams:data,nextId:nextId,nextStepId:nextStepId});
    pill(ok?"ok":"err",ok?"✓ Sync":"Offline");
    return;
  }

  // 3. Nothing found
  pill("err","Keine Daten");
  render();
}

// ---- SAVE ----
function save(){
  lsSet();
  if(saveTimer)clearTimeout(saveTimer);
  pill("busy","Speichert...");
  lastSaveTime=Date.now();
  saveTimer=setTimeout(async function(){
    var ok=await sbUpsert({streams:data,nextId:nextId,nextStepId:nextStepId});
    pill(ok?"ok":"err",ok?"✓ Sync":"Offline");
  },1000);
}

function resetData(){
  if(!confirm("Wirklich zurücksetzen?"))return;
  data=[];nextId=50;nextStepId=500;save();render();
}

// ---- FILTER ----
function ds(d){return d.toISOString().split("T")[0];}

function getRange(){
  var today=new Date();today.setHours(0,0,0,0);
  var to=new Date(today);
  if(activeChip===0){return{from:new Date(0),to:today,today:today};}
  if(activeChip===1){var day=today.getDay(),diff=day===0?6:day-1;to.setDate(today.getDate()+(6-diff));return{from:new Date(0),to:to,today:today};}
  if(activeChip===2){to.setDate(today.getDate()+13);return{from:new Date(0),to:to,today:today};}
  var fv=document.getElementById("fdate-from").value;
  var tv=document.getElementById("fdate-to").value;
  return{from:fv?new Date(fv):new Date(0),to:tv?new Date(tv):new Date(9999,0,1),today:today};
}

function setChip(n){
  activeChip=n;
  ["chip-today","chip-week","chip-2w","chip-custom"].forEach(function(id,i){
    document.getElementById(id).className="fchip"+(i===n?" active":"");
  });
  document.getElementById("custom-range").style.display=n===3?"flex":"none";
  renderAgenda();
}

// ---- RENDER AGENDA ----
function renderAgenda(){
  var r=getRange(),todayStr=ds(r.today),fromStr=ds(r.from),toStr=ds(r.to);
  var items=[],seen={};
  data.forEach(function(s){s.steps.forEach(function(st){
    var k=s.id+"-"+st.id;
    if(!st.done&&st.deadline&&!seen[k]){
      var inRange=st.deadline>=fromStr&&st.deadline<=toStr;
      var overdue=st.deadline<todayStr&&activeChip!==3;
      if(inRange||overdue){seen[k]=true;items.push({id:st.id,text:st.text,deadline:st.deadline,sn:s.name,sid:s.id});}
    }
  });});
  items.sort(function(a,b){return a.deadline<b.deadline?-1:a.deadline>b.deadline?1:0;});
  document.getElementById("abadge").textContent=items.length;
  if(!items.length){document.getElementById("agbody").innerHTML="<p class=\"aempty\">Keine Aufgaben im gewählten Zeitraum.</p>";return;}
  var groups={};
  items.forEach(function(x){if(!groups[x.deadline])groups[x.deadline]=[];groups[x.deadline].push(x);});
  var h="";
  Object.keys(groups).sort().forEach(function(k){
    var d=new Date(k),isOv=k<todayStr,isT=k===todayStr;
    var lbl=isOv?"⚠ Überfällig – "+d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}):
      isT?"Heute – "+d.toLocaleDateString("de-DE",{day:"2-digit",month:"long"}):
      d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"});
    h+="<div class=\"aday\"><div class=\"aday-label"+(isOv||isT?" hot":"")+"\">"+lbl+"</div>";
    groups[k].forEach(function(x){
      h+="<div class=\"aitem\"><div class=\"acheck\" onclick=\"tsi("+x.sid+","+x.id+")\"></div>"+
        "<div><div class=\"aitem-text\">"+esc(x.text)+"</div>"+
        "<div class=\"aitem-meta\"><span class=\"aitem-stream\">"+esc(x.sn)+"</span></div></div></div>";
    });
    h+="</div>";
  });
  document.getElementById("agbody").innerHTML=h;
}

// ---- RENDER ALL ----
function render(){
  renderAgenda();renderSummary();
  var c=document.getElementById("streams");c.innerHTML="";
  if(!data.length){c.innerHTML="<p class=\"aempty\" style=\"padding:1rem\">Noch keine Workstreams.</p>";return;}
  data.forEach(function(s){c.appendChild(mkCard(s));});
}

function renderSummary(){
  var cnt={green:0,yellow:0,red:0};data.forEach(function(s){cnt[s.status]++;});
  var dn=0,tot=0;data.forEach(function(s){dn+=s.steps.filter(function(x){return x.done;}).length;tot+=s.steps.length;});
  document.getElementById("sumbar").innerHTML=
    "<div class=\"si\"><span class=\"dot\" style=\"background:#44998A\"></span>"+cnt.green+" läuft</div>"+
    "<div class=\"si\"><span class=\"dot\" style=\"background:#FFAF4B\"></span>"+cnt.yellow+" in Arbeit</div>"+
    "<div class=\"si\"><span class=\"dot\" style=\"background:#FF624C\"></span>"+cnt.red+" blockiert</div>"+
    "<div class=\"si\" style=\"margin-left:auto;color:#A07089\">"+dn+"/"+tot+" erledigt</div>";
}

function dlt(dl,done){
  if(!dl||done)return"";
  var today=new Date();today.setHours(0,0,0,0);
  var d=new Date(dl),diff=Math.round((d-today)/86400000);
  var fmt=d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
  if(diff<0)return"<span class=\"dltag dlbad\">⚠ "+fmt+"</span>";
  if(diff<=7)return"<span class=\"dltag dlwarn\">"+fmt+"</span>";
  return"<span class=\"dltag dlok\">"+fmt+"</span>";
}

function mkCard(s){
  var bc=BADGE[s.status][0],bl=BADGE[s.status][1];
  var el=document.createElement("div");el.className="scard";
  var h="<div class=\"shdr "+s.status+"\" onclick=\"tog("+s.id+",event)\">"+
    "<span class=\"sname-lbl\" id=\"lbl"+s.id+"\">"+esc(s.name)+"</span>"+
    "<input class=\"sname-inp\" id=\"inp"+s.id+"\" value=\""+esc(s.name)+"\""+
    " onclick=\"event.stopPropagation()\" onblur=\"fe("+s.id+")\""+
    " onkeydown=\"if(event.keyCode===13)this.blur()\" onchange=\"un("+s.id+",this.value)\"/>"+
    "<span class=\"sedit\" onclick=\"event.stopPropagation();se("+s.id+")\">✎</span>"+
    "<button class=\"sbadge "+bc+"\" onclick=\"event.stopPropagation();cs("+s.id+")\">"+bl+"</button>"+
    "<span class=\"sdel\" onclick=\"event.stopPropagation();ds2("+s.id+")\">×</span>"+
    "<span class=\"schev"+(s.open?" open":"")+"\">&#9662;</span></div>"+
    "<div class=\"sbody"+(s.open?" open":"")+"\" id=\"bd"+s.id+"\">"+
    "<div class=\"slbl\">Nächste Schritte</div>"+
    "<div id=\"st"+s.id+"\">"+s.steps.map(function(st){return sh(s.id,st);}).join("")+"</div>"+
    "<div class=\"addrow\">"+
    "<input type=\"text\" id=\"ns"+s.id+"\" placeholder=\"Schritt hinzufügen...\" onkeydown=\"if(event.keyCode===13)as("+s.id+")\"/>"+
    "<input type=\"date\" id=\"nd"+s.id+"\" />"+
    "<button onclick=\"as("+s.id+")\">+ Hinzufügen</button></div>"+
    "<div class=\"notesarea\"><div class=\"slbl\" style=\"margin-top:14px\">Notizen</div>"+
    "<textarea onchange=\"no("+s.id+",this.value)\">"+esc(s.notes||"")+"</textarea></div></div>";
  el.innerHTML=h;return el;
}

function sh(sid,st){
  return "<div class=\"step-row\">"+
    "<div class=\"stchk"+(st.done?" done":"")+"\" onclick=\"ts("+sid+","+st.id+")\"></div>"+
    "<div class=\"stmain\"><div class=\"stxt"+(st.done?" done":"")+"\">"+esc(st.text)+"</div>"+
    "<div class=\"smeta\"><input type=\"date\" class=\"dlinp\" value=\""+(st.deadline||"")+"\""+
    " onchange=\"ud("+sid+","+st.id+",this.value)\" onclick=\"event.stopPropagation()\" />"+
    dlt(st.deadline,st.done)+"</div></div>"+
    "<span class=\"stdel\" onclick=\"del("+sid+","+st.id+")\">×</span></div>";
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function tog(id,e){var s=data.find(function(x){return x.id===id;});s.open=!s.open;save();render();}
function un(id,v){data.find(function(x){return x.id===id;}).name=v;save();}
function no(id,v){data.find(function(x){return x.id===id;}).notes=v;save();}
function se(id){document.getElementById("lbl"+id).style.display="none";var i=document.getElementById("inp"+id);i.style.display="block";i.focus();i.select();}
function fe(id){var i=document.getElementById("inp"+id);document.getElementById("lbl"+id).textContent=i.value;i.style.display="none";document.getElementById("lbl"+id).style.display="";}
function cs(id){var s=data.find(function(x){return x.id===id;});var o=["green","yellow","red"];s.status=o[(o.indexOf(s.status)+1)%3];save();render();}
function ds2(id){if(!confirm("Workstream löschen?"))return;data=data.filter(function(x){return x.id!==id;});save();render();}
function ts(sid,stid){var s=data.find(function(x){return x.id===sid;});var st=s.steps.find(function(x){return x.id===stid;});st.done=!st.done;save();document.getElementById("st"+sid).innerHTML=s.steps.map(function(t){return sh(sid,t);}).join("");renderSummary();renderAgenda();}
function tsi(sid,stid){ts(sid,stid);}
function ud(sid,stid,v){var s=data.find(function(x){return x.id===sid;});s.steps.find(function(x){return x.id===stid;}).deadline=v;save();document.getElementById("st"+sid).innerHTML=s.steps.map(function(t){return sh(sid,t);}).join("");renderSummary();renderAgenda();}
function del(sid,stid){var s=data.find(function(x){return x.id===sid;});s.steps=s.steps.filter(function(x){return x.id!==stid;});save();document.getElementById("st"+sid).innerHTML=s.steps.map(function(t){return sh(sid,t);}).join("");renderSummary();renderAgenda();}
function as(sid){var i=document.getElementById("ns"+sid);var dl=document.getElementById("nd"+sid);var t=i.value.trim();if(!t)return;var s=data.find(function(x){return x.id===sid;});s.steps.push({id:nextStepId++,text:t,done:false,deadline:dl.value||""});i.value="";dl.value="";save();document.getElementById("st"+sid).innerHTML=s.steps.map(function(st){return sh(sid,st);}).join("");renderSummary();renderAgenda();}
function addStream(){data.push({id:nextId++,name:"Neuer Workstream",status:"yellow",open:true,notes:"",steps:[]});save();render();setTimeout(function(){se(nextId-1);},50);}

// ---- REALTIME SUBSCRIPTION ----
function startRealtime(){
  try{
    var _sb=supabase.createClient(SB_URL,SB_KEY);
    _sb.channel("feego_live")
      .on("postgres_changes",{event:"*",schema:"public",table:"feego_data"},function(payload){
        if(Date.now()-lastSaveTime<3000)return;
        var remote=payload.new&&payload.new.value;
        if(!remote||!remote.streams)return;
        if(remote._sid===SESSION_ID)return; // own change, ignore
        data=remote.streams;
        nextId=remote.nextId||50;
        nextStepId=remote.nextStepId||500;
        lsSet();render();
        pill("ok","✓ Live ↓");
        setTimeout(function(){pill("ok","✓ Live");},1500);
      })
      .subscribe(function(status){
        if(status==="SUBSCRIBED")pill("ok","✓ Live");
        if(status==="CLOSED"||status==="CHANNEL_ERROR")pill("err","Offline");
      });
  }catch(e){}
}

// Start
load();
startRealtime();
</script>
